name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Typecheck, lint, tests, build, budget
    # Image fixée : Playwright 1.56.1 (épinglé, cf. CLAUDE.md) ne sait pas installer Chromium
    # sur ubuntu-latest, passé en 26.04. À relever en même temps que Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests unitaires et couverture
        run: npm run coverage
      - run: npm run build
      - name: Budget de taille (PERF-1)
        run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Parcours e2e (Playwright + axe)
    # Image fixée : Playwright 1.56.1 (épinglé, cf. CLAUDE.md) ne sait pas installer Chromium
    # sur ubuntu-latest, passé en 26.04. À relever en même temps que Playwright.
    runs-on: ubuntu-24.04
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse (PERF-2)
    # Image fixée : Playwright 1.56.1 (épinglé, cf. CLAUDE.md) ne sait pas installer Chromium
    # sur ubuntu-latest, passé en 26.04. À relever en même temps que Playwright.
    runs-on: ubuntu-24.04
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Outil lancé ponctuellement (non installé dans le projet : dépendances vulnérables, SEC-6).
      - name: Lighthouse CI (mobile, médiane de 3 passes)
        run: npx -y @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 7
